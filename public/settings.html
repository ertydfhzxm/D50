<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing-C · 账号设置</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    body { background: var(--color-bg); padding-top: 80px; }
    .settings-container { max-width: 600px; margin: 2rem auto; padding: 2rem; background: var(--color-bg-card); border-radius: 20px; box-shadow: var(--shadow-xl); border: 1px solid rgba(0,0,0,0.05); }
    .settings-header { text-align: center; margin-bottom: 2rem; }
    .settings-title { font-size: 1.8rem; font-weight: 800; color: var(--color-text); }
    .settings-group { margin-bottom: 2rem; }
    .settings-group h3 { font-size: 1.1rem; color: var(--color-text-secondary); margin-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--color-text); }
    .form-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: var(--radius-md); font-size: 1rem; transition: var(--transition-base); }
    .form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(255,107,74,0.1); }
    .btn-save { width: 100%; padding: 0.75rem; background: var(--gradient-primary); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,74,0.2); }
    .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; width: 100%; padding: 0.75rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; margin-top: 1rem; transition: all 0.2s; }
    .btn-danger:hover { background: #fecaca; }
    
    .breadcrumb-nav { max-width: 1200px; margin: 1rem auto; padding: 0 2rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--color-text-muted); }
    .breadcrumb-nav a { color: var(--color-text-secondary); font-weight: 500; text-decoration: none; }
    .breadcrumb-nav a:hover { color: var(--color-primary); }
  </style>
</head>
<body>
  <!-- 标准全局导航 -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">⛏️</span>
        <span class="logo-text">Landing-C</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="experience.html">陪伴空间</a></li>
        <li><a href="game.html">人生游戏</a></li>
        <li><a href="about.html">使命愿景</a></li>
        <li><a href="#" id="navLoginBtn">登录 / 注册</a></li>
        <li id="navUserMenu" class="nav-user-menu" style="display:none;">
          <a href="profile.html" class="nav-avatar">
            <span class="avatar-icon">🧑</span>
            <span id="navUsername"></span>
          </a>
          <div class="dropdown-menu">
            <a href="profile.html">个人主页</a>
            <a href="settings.html">账号设置</a>
            <a href="#" id="navLogout">退出登录</a>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <!-- 面包屑导航 -->
  <div class="breadcrumb-nav">
    <a href="index.html">返回主页</a>
    <span>/</span>
    <span>账号设置</span>
  </div>

  <main class="settings-container">
    <div class="settings-header">
      <h1 class="settings-title">账号设置</h1>
      <p style="color: var(--color-text-muted); margin-top: 0.5rem;">管理你的个人信息与安全选项</p>
    </div>

    <div class="settings-group">
      <h3>基本资料</h3>
      <div class="form-group">
        <label class="form-label">昵称</label>
        <input type="text" class="form-input" id="settingNickname" placeholder="你的昵称">
      </div>
      <button class="btn-save" id="btnSaveProfile">保存修改</button>
    </div>

    <div class="settings-group">
      <h3>安全设置</h3>
      <div class="form-group">
        <label class="form-label">修改密码</label>
        <input type="password" class="form-input" placeholder="输入新密码">
      </div>
      <button class="btn-save">更新密码</button>
    </div>

    <div class="settings-group" style="margin-top: 3rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 2rem;">
      <h3>危险操作</h3>
      <button class="btn-danger">退出登录</button>
      <button class="btn-danger" style="margin-top: 0.5rem; background: none; border-color: transparent;">注销账号</button>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userStr = localStorage.getItem('landingc_user');
      if (userStr) {
        const user = JSON.parse(userStr);
        document.getElementById('settingNickname').value = user.nickname;
      } else {
        window.location.href = 'index.html'; // 未登录拦截
      }

      document.getElementById('btnSaveProfile').addEventListener('click', () => {
        alert('资料修改功能尚未对接后端 API，前端仅作演示。');
      });
    });
  </script>
</body>
</html>
